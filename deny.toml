[graph]
all-features = false

[licenses]
allow = [
  "GPL-3.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OFL-1.1",
  "CC0-1.0",
  "BSL-1.0",
  "NCSA",
  "LicenseRef-Slint-Royalty-free-2.0",
  "LicenseRef-Slint-Software-3.0",
]

[advisories]
yanked = "deny"
ignore = [
  "RUSTSEC-2024-0436",
  "RUSTSEC-2026-0206",
  "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
