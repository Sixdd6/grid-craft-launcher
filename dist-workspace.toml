[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin", "aarch64-apple-darwin"]
# Run only `dist plan` on pull requests
pr-run-mode = "plan"
# Extra steps for the build jobs: exports the CurseForge key from a repository secret.
github-build-setup = "dist-build-setup.yml"

# System libraries Slint (winit + FemtoVG) needs on the Linux runner.
# Same package list as .github/workflows/ci.yml.
[dist.dependencies.apt]
libfontconfig1-dev = "*"
libfreetype-dev = "*"
libxkbcommon-dev = "*"
libwayland-dev = "*"
libxcb1-dev = "*"
