[workspace]
resolver = "3"
members = ["crates/gcl-core", "crates/gcl-cli", "crates/gcl-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sixdd6/grid-craft-launcher"
rust-version = "1.97"
publish = false

[workspace.dependencies]
gcl-core = { path = "crates/gcl-core" }
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
keyring = "4"
uuid = { version = "1.26", features = ["v3", "v4", "serde"] }
sha1 = "0.11"
hex = "0.4"
percent-encoding = "2.3"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "gzip", "http2", "charset"] }
sha2 = "0.11"
md-5 = "0.11"
murmur2 = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "macros"] }
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"
insta = { version = "1.48", features = ["json", "filters"] }
wiremock = "0.6"
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
slint-build = "1.17"
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
