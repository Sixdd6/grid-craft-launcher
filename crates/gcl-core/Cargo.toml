[package]
name = "gcl-core"
description = "Core library for GRID Craft Launcher: instances, versions, loaders, sources, auth, launch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
directories.workspace = true
keyring.workspace = true
percent-encoding.workspace = true
regex.workspace = true
reqwest.workspace = true
sha1.workspace = true
md-5.workspace = true
murmur2.workspace = true
hex.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# `local-offset` lets `launch::log4j` show game log timestamps in the machine's time zone.
time = { workspace = true, features = ["local-offset"] }
zip.workspace = true

# Unix-only: `SIGTERM` then `SIGKILL` for `Launcher::stop_instance`.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
wiremock.workspace = true

[package.metadata.dist]
dist = false
