[package]
name = "gcl-ui"
description = "Slint desktop UI for GRID Craft Launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "gcl_ui"
path = "src/lib.rs"

[[bin]]
name = "grid-craft-launcher"
path = "src/main.rs"

[dependencies]
gcl-core.workspace = true
png.workspace = true
slint.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util.workspace = true
i-slint-backend-testing.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
wiremock.workspace = true
zip.workspace = true

[build-dependencies]
slint-build.workspace = true

# `publish = false` hides these binaries from dist; opt back in.
[package.metadata.dist]
dist = true
