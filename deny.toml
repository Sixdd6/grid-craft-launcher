[graph]
all-features = false

[licenses]
allow = [
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "NCSA",
  "CDLA-Permissive-2.0", # webpki-root-certs: Mozilla CA bundle data, via reqwest rustls
]

[advisories]
yanked = "deny"
ignore = [
  "RUSTSEC-2024-0436", # paste: unmaintained, transitive via slint, no safe upgrade
  "RUSTSEC-2026-0206", # rustybuzz: unmaintained, transitive via slint, no safe upgrade
  "RUSTSEC-2026-0192", # ttf-parser: unmaintained, transitive via slint, no safe upgrade
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
